server {
    listen __UI_LISTEN__;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One connection per request, so "Keep changes" has to open a new one and fails if the
    # Apply blocked new connections. The firewall accepts established connections, so a
    # reused one would outlive the cut. The short header timeout drops sockets a browser
    # opens ahead of time, which could otherwise carry the request the same way.
    keepalive_timeout 0;
    client_header_timeout 5s;

    location /api/ {
        proxy_pass http://__API_HOST__/api/;
        proxy_http_version 1.1;
        # $http_host keeps the port. The API compares Origin with Host on plain HTTP (see docs/security-and-privacy.md).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # After UI image rebuilds, force revalidation so browsers do not keep stale js modules / style.css
    # (dev stack uses no-store in docker/nginx.dev.conf).
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, private, must-revalidate" always;
    }

    # Browsers and crawlers ask for this path whatever the page links to.
    location = /favicon.ico {
        rewrite ^ /static/favicon.svg last;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
        add_header Cache-Control "no-cache, private, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-cache, private, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
