# Builds the admin UI image for every platform we release. The release workflows call
# this with a tag to publish it to GHCR; pull requests that touch the image only build it.
name: UI image

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v0.17.0)
        required: true
        type: string
  pull_request:
    paths:
      - .dockerignore
      - docker/Dockerfile
      - docker/entrypoint.sh
      - docker/nginx.conf
      - .github/workflows/ui-image.yml

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.tag != '' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out version and tags
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/imevul/evuproxy-ui
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=dev
          tags="${IMAGE}:dev"
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            tags="${IMAGE}:${version}"
            # A prerelease or a release of an older line must not move `latest`.
            if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "$TAG" ]; then
              tags="${tags},${IMAGE}:latest"
            fi
          fi
          {
            echo "version=${version}"
            echo "tags=${tags}"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.tag != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            EVUPROXY_VERSION=${{ steps.meta.outputs.version }}
            EVUPROXY_REVISION=${{ steps.meta.outputs.revision }}
            EVUPROXY_CREATED=${{ steps.meta.outputs.created }}
