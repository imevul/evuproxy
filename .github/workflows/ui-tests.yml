name: UI tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: playwright (${{ matrix.target }})
    # Pinned, not ubuntu-latest: `playwright install --with-deps` only supports
    # the Ubuntu releases the locked Playwright version knows about.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # Report both suites even if one fails.
      fail-fast: false
      matrix:
        # Separate runners, so each suite gets its own mock state and its own
        # playwright-report/ and test-results/, which a later run would wipe.
        target: [a11y, ui-behavior]
    env:
      PWTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: devtools/playwright-visual/package-lock.json
      - name: Install Playwright
        # As `make playwright-deps`, plus the system libraries Chromium needs on a clean runner.
        working-directory: devtools/playwright-visual
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start mock stack
        # docker/mock-api/state/ is empty after checkout and goes away with the runner.
        run: make up
      - name: Wait for mock stack
        # Goes through the UI's nginx to the mock API, so it covers both containers.
        run: |
          curl -sSf -o /dev/null --retry 30 --retry-delay 2 --retry-connrefused \
            -H "Authorization: Bearer dev" http://127.0.0.1:9080/api/v1/status
      - name: Run suite
        run: make ${{ matrix.target }}
      - name: Show mock stack logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.target }}
          path: |
            devtools/playwright-visual/playwright-report/
            devtools/playwright-visual/test-results/
          retention-days: 14
