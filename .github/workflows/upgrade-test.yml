name: Binary upgrade

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Load WireGuard
        # A container can't count on the kernel loading this for it.
        run: sudo modprobe wireguard
      - name: Upgrade, rollback and failed downloads under systemd
        run: make upgrade-test
