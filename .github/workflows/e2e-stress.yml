name: E2E stress

permissions:
  contents: read

# Slower and more timing-sensitive than the smoke test, so it isn't on every pull request. It runs
# on demand from the Actions tab, and when something it depends on changes.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - devtools/e2e/**
      - internal/gen/nftables*.go
      - internal/apply/crowdsec_set.go
      - .github/workflows/e2e-stress.yml

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Load WireGuard
        # A container can't count on the kernel loading this for it.
        run: sudo modprobe wireguard
      - name: Rate limits and CrowdSec drops under load
        # bash, not the default, so the pipe keeps make's exit code.
        shell: bash
        run: make e2e-stress | tee stress.log
      - name: Report the measurements
        if: always()
        shell: bash
        run: |
          {
            echo "| Measurement | Got | Allowed |"
            echo "| --- | --- | --- |"
            grep -o '| .* | [0-9]* | [0-9]*\.\.[0-9]* |$' stress.log
          } >>"$GITHUB_STEP_SUMMARY"
