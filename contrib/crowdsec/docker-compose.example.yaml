# Example CrowdSec + nftables bouncer on the same Linux host as EvuProxy.
# Prefer: make crowdsec-install   or   ./install.sh
# Manual: see README.md

services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      # Hub collection on first start (SSH and common Linux scenarios).
      COLLECTIONS: "crowdsecurity/linux"
      # cscli reads local_api_credentials.yaml; without this the entrypoint leaves
      # url at http://0.0.0.0:8080 (listen_uri) and cscli cannot connect as a client.
      LOCAL_API_URL: http://127.0.0.1:8080
      # Lab hosts often block outbound HTTPS to CrowdSec; skip online registration and
      # hub upgrade on start (Hub content is bundled in the image — LAPI + local scenarios still work).
      DISABLE_ONLINE_API: "true"
      NO_HUB_UPGRADE: "true"
    ports:
      # Local API — bouncer on the host uses http://127.0.0.1:8080
      - "127.0.0.1:8080:8080"
    # acquis.yaml must exist as a *file* before the first `compose up` (install.sh creates it).
    # If missing, Docker creates a directory named acquis.yaml and CrowdSec exits on startup.
    volumes:
      - ./acquis.yaml:/etc/crowdsec/acquis.d/evuproxy.yaml:ro
      - crowdsec-data:/var/lib/crowdsec/data
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  crowdsec-firewall-bouncer:
    build:
      context: .
      dockerfile: Dockerfile.bouncer
      network: host
    image: evuproxy-crowdsec-firewall-bouncer:local
    container_name: crowdsec-firewall-bouncer
    restart: unless-stopped
    depends_on:
      crowdsec:
        condition: service_healthy
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./docker-bouncer.yaml:/config/crowdsec-firewall-bouncer.yaml:ro
    environment:
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:-}
      CROWDSEC_LAPI_URL: ${CROWDSEC_LAPI_URL:-http://127.0.0.1:8080}

volumes:
  crowdsec-data:
